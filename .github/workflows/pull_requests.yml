---
name: Berry Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: ./.github/actions/uv-setup

      - name: Run all pre-commit hooks
        run: uv run pre-commit run --all-files

  build:
    needs: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: ./.github/actions/uv-setup

      - name: Build distributions
        run: uv build
