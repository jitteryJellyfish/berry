[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "berry-suite"
version = "2.0.0"
description = "Tools for extracting and analyzing Bloch wavefunctions from DFT calculations."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Berry Developers", email = "ricardo.ribeiro@physics.org" },
    { name = "Rafael Sucena", email = "rafael.sucena.academic@gmail.com" },
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9.3",
    "matplotlib>=3.6",
    "numba>=0.56.4",
    "networkx>=2.8",
    "findiff>=0.9.2",
    "colorama>=0.4.6",
    "argcomplete>=2.0",
    "psutil>=5.9",
    "threadpoolctl>=3.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://ricardoribeiro-2020.github.io/berry/"
Source = "https://github.com/ricardoribeiro-2020/berry"

[project.scripts]
berry = "berry.cli:berry_cli"
berry-vis = "berry.cli:berry_vis_cli"

[project.optional-dependencies]
dev = ["twine"]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
]

[tool.setuptools]
packages = ["berry", "berry._subroutines", "berry.utils", "berry.vis"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E203", "B904", "UP007", "UP047", "C401"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["berry"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
