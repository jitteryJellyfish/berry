repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(berry/berry_geometry_torch\.py|tests/test_berry_geometry_torch\.py)$
      - id: ruff-format
        files: ^(berry/berry_geometry_torch\.py|tests/test_berry_geometry_torch\.py)$
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --follow-imports=skip berry/berry_geometry_torch.py tests/test_berry_geometry_torch.py
        language: system
        pass_filenames: false
        files: ^(berry/berry_geometry_torch\.py|tests/test_berry_geometry_torch\.py|pyproject\.toml)$
      - id: unit-tests
        name: unit tests
        entry: uv run pytest -q tests
        language: system
        pass_filenames: false
        files: ^(berry/berry_geometry_torch\.py|tests/.*\.py|pyproject\.toml)$
